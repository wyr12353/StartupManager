name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Add Windows SDK resource compiler
        shell: pwsh
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $rc = Get-ChildItem $sdkRoot -Recurse -Filter rc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\rc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $rc) {
            throw "rc.exe not found under $sdkRoot"
          }
          $rc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Version consistency
        run: npm run version:check

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
